# Every Ear — kernel/network tuning for many concurrent WebRTC/UDP sessions.
#
# Install to /etc/sysctl.d/99-every-ear.conf, then `sysctl --system`.
# Without the larger UDP buffers LiveKit logs "receive buffer too small" and
# drops packets under load (audible glitches at the start of a big event).

# Socket buffers (matches the values recommended in the README).
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.core.rmem_default=1048576
net.core.wmem_default=1048576
net.core.netdev_max_backlog=5000
net.ipv4.udp_rmem_min=16384
net.ipv4.udp_wmem_min=16384

# Deep accept queue + fast TIME_WAIT recycling for the join burst at event start
# (hundreds of TLS handshakes + WebSocket upgrades in a few seconds).
net.core.somaxconn=4096
net.ipv4.tcp_max_syn_backlog=4096
net.ipv4.tcp_fin_timeout=15
net.ipv4.tcp_tw_reuse=1
