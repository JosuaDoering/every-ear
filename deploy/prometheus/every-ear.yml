# Sample Prometheus scrape config for an Every Ear host.
#
# Metrics exposed:
#   - LiveKit SFU        : http://127.0.0.1:6789/metrics
#   - Caddy (admin API)  : http://127.0.0.1:2019/metrics
#   - Backend            : (health only) http://127.0.0.1:3000/api/health
#
# Drop into /etc/prometheus/prometheus.yml under `scrape_configs:`.

scrape_configs:
  - job_name: livekit
    scrape_interval: 15s
    static_configs:
      - targets: ["127.0.0.1:6789"]

  - job_name: caddy
    scrape_interval: 15s
    static_configs:
      - targets: ["127.0.0.1:2019"]
